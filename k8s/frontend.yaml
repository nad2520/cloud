apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloud-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: cloud-frontend:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloud-demo
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
